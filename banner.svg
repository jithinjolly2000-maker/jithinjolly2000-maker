<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jithin J — analyst who designs systems: data, automation, risk and controls">
  <defs>
    <pattern id="g1" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7fb6c4" stroke-opacity=".07"/></pattern>
    <pattern id="g2" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#7fb6c4" stroke-opacity=".13"/></pattern>
    <style>
      .t{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
      .m{font-family:ui-monospace,'Cascadia Code',Consolas,'Liberation Mono',monospace}
      .wire{stroke:#7fb6c4;stroke-width:2;fill:none;stroke-dasharray:6 5;animation:flow 1s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-11}}
      .pulse{animation:p 2s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
      .rise{opacity:0;animation:r .9s ease forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}
      @keyframes r{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.wire,.pulse{animation:none}.rise{animation:none;opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="16" fill="#0a0c0f"/>
  <rect width="1200" height="300" rx="16" fill="url(#g1)"/>
  <rect width="1200" height="300" rx="16" fill="url(#g2)"/>
  <!-- crop marks -->
  <path d="M28 46V28H46M1154 28H1172V46M28 254V272H46M1154 272H1172V254" stroke="#c9a66b" stroke-width="2" fill="none"/>

  <g class="rise d1"><text x="64" y="86" class="m" font-size="14" letter-spacing="3" fill="#e4c88f">JITHIN J / ANALYST WHO DESIGNS SYSTEMS</text></g>
  <g class="rise d2"><text x="62" y="152" class="t" font-size="56" font-weight="800" fill="#f2efe8" letter-spacing="-1.5">Messy process in.</text></g>
  <g class="rise d3"><text x="62" y="212" class="t" font-size="56" font-weight="800" fill="#e4c88f" letter-spacing="-1.5">Working system out.</text></g>
  <g class="rise d4"><text x="64" y="252" class="m" font-size="14" fill="#a3a29a">data quality · automation · risk &amp; controls · BI &amp; reporting · SQL</text></g>

  <!-- mini system diagram -->
  <g class="m" font-size="12">
    <rect x="760" y="70" width="110" height="46" rx="8" fill="#0f1216" stroke="#30343a" stroke-dasharray="4 3"/>
    <text x="815" y="98" text-anchor="middle" fill="#c9a66b" letter-spacing="2">INPUT</text>
    <rect x="930" y="112" width="120" height="76" rx="10" fill="#1a1710" stroke="#c9a66b" stroke-opacity=".6"/>
    <text x="990" y="146" text-anchor="middle" fill="#e4c88f" letter-spacing="2">LOGIC</text>
    <text x="990" y="166" text-anchor="middle" fill="#a3a29a" font-size="10.5">rules · checks</text>
    <rect x="760" y="184" width="110" height="46" rx="8" fill="#0f1216" stroke="#30343a" stroke-dasharray="4 3"/>
    <text x="815" y="212" text-anchor="middle" fill="#7fb6c4" letter-spacing="2">REVIEW</text>
    <rect x="1080" y="128" width="84" height="44" rx="8" fill="#0f1216" stroke="#30343a" stroke-dasharray="4 3"/>
    <text x="1122" y="155" text-anchor="middle" fill="#c9a66b" letter-spacing="2">OUT</text>
  </g>
  <path class="wire" d="M870 93H900V138H926"/>
  <path class="wire" d="M930 168H900V207H874"/>
  <path class="wire" d="M1050 150H1076"/>
  <circle class="pulse" cx="1150" cy="56" r="5" fill="#7fd19b"/>
  <text x="1138" y="60" text-anchor="end" class="m" font-size="11" fill="#a3a29a">status: shipping</text>
</svg>
