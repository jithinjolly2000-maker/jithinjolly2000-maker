<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jithin J — Build steady. Ship often. Keep your balance.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1113"/><stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#c9a66b" stop-opacity=".16"/><stop offset="1" stop-color="#c9a66b" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
      .s{font-family:Georgia,'Times New Roman',serif}
      .drop{opacity:0;animation:drop .9s ease forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}.d4{animation-delay:1.4s}
      @keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
      .fade{opacity:0;animation:fade 1.4s ease forwards}
      .f1{animation-delay:.3s}.f2{animation-delay:.9s}.f3{animation-delay:1.6s}
      @keyframes fade{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){.drop,.fade{animation:none;opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>

  <!-- balancing stones -->
  <g transform="translate(935 0)">
    <ellipse cx="0" cy="262" rx="120" ry="7" fill="#000" opacity=".35"/>
    <g class="drop d4"><ellipse cx="0" cy="232" rx="78" ry="28" fill="#5d5547"/><ellipse cx="-14" cy="224" rx="52" ry="10" fill="#8d8678" opacity=".35"/></g>
    <g class="drop d3"><ellipse cx="4" cy="184" rx="58" ry="22" fill="#7a7060"/><ellipse cx="-8" cy="177" rx="36" ry="8" fill="#a59d8c" opacity=".35"/></g>
    <g class="drop d2"><ellipse cx="-2" cy="145" rx="42" ry="18" fill="#9a8f7b"/><ellipse cx="-10" cy="139" rx="24" ry="6" fill="#c2b9a5" opacity=".4"/></g>
    <g class="drop d1"><ellipse cx="3" cy="114" rx="26" ry="14" fill="#c9a66b"/><ellipse cx="-3" cy="109" rx="13" ry="4" fill="#e4c88f" opacity=".6"/></g>
  </g>

  <g class="fade f1"><text x="70" y="96" class="t" font-size="14" letter-spacing="5" fill="#c9a66b">JITHIN J</text></g>
  <g class="fade f2">
    <text x="68" y="158" class="t" font-size="50" font-weight="800" fill="#f4f1ea" letter-spacing="-1">Build steady. Ship often.</text>
    <text x="68" y="214" class="t" font-size="50" font-weight="800" fill="#e4c88f" letter-spacing="-1">Keep your balance.</text>
  </g>
  <g class="fade f3"><text x="70" y="256" class="s" font-size="17" font-style="italic" fill="#a8a79f">Data, risk &amp; automation — tools that quietly run themselves.</text></g>
</svg>
